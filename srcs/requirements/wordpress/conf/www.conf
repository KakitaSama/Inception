[www]

; Worker identity
user = www-data
group = www-data

; NGINX will connect through the Docker network.
listen = 0.0.0.0:9000

; Worker-pool strategy
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; WordPress directory
chdir = /var/www/html

; Send worker output and PHP errors to Docker logs.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; Keep only PHP as an executable FastCGI script type.
security.limit_extensions = .php
