services:
  mariadb:
    image: mariadb:1.0
    container_name: mariadb

    build:
      context: requirements/mariadb
      dockerfile: Dockerfile

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

    secrets:
      - db_root_password
      - db_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception

    expose:
      - "3306"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin -uroot -p"$$(cat /run/secrets/db_root_password)" ping --silent
      interval: 2s
      timeout: 2s
      retries: 30

  wordpress:
    image: wordpress:1.0
    container_name: wordpress

    build:
      context: requirements/wordpress
      dockerfile: Dockerfile

    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}

    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

    depends_on:
      mariadb:
        condition: service_healthy

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception

    expose:
      - "9000"

    restart: unless-stopped

  nginx:
    image: nginx:1.0
    container_name: nginx

    build:
      context: requirements/nginx
      dockerfile: Dockerfile
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}

    depends_on:
      - wordpress

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/html:ro

    networks:
      - inception

    restart: unless-stopped

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb

  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt

  db_password:
    file: ../secrets/db_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt
